<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Calculus checker</title>
<!-- The check-mode page (app/PAGE.md). Untrusted and holds nothing: every
     goal, report and obligation below is a string from the JSON API. -->
<style>
:root {
  --bg: #fbfaf7; --panel: #ffffff; --ink: #1d1d1b; --muted: #6b6a66;
  --line: #e2dfd8; --accent: #2f5d8a; --ok: #2e7d4f; --bad: #b3261e;
  --warn: #8a5a00; --sel: #e8eef5; --code: #f3f1ec;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --sans: system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #161615; --panel: #1f1f1d; --ink: #e9e7e1; --muted: #9b998f;
    --line: #34332f; --accent: #8fb6de; --ok: #7fc79a; --bad: #f08b83;
    --warn: #e0b35a; --sel: #26303a; --code: #2a2926;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg); color: var(--ink); font: 14px/1.45 var(--sans);
  display: grid; grid-template-rows: 1fr auto auto; min-height: 100vh;
}
main {
  display: grid; grid-template-columns: minmax(240px, 1fr) minmax(260px, 1.2fr)
  minmax(300px, 1.4fr); gap: 1px; background: var(--line); min-height: 0;
}
section { background: var(--panel); padding: 14px 16px; overflow: auto; min-height: 0; }
h2 { font-size: 12px; letter-spacing: .06em; text-transform: uppercase;
     color: var(--muted); margin: 0 0 10px; font-weight: 600; }
h3 { font-size: 15px; margin: 14px 0 4px; }
.mono, code, input.term, textarea { font-family: var(--mono); font-size: 13px; }
.goal { background: var(--code); padding: 8px 10px; border-radius: 6px;
        white-space: pre-wrap; word-break: break-word; }
.muted { color: var(--muted); }
label { display: block; font-size: 12px; color: var(--muted); margin: 8px 0 3px; }
input, select, textarea, button {
  font: inherit; color: var(--ink); background: var(--bg);
  border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px;
}
input, textarea, select { width: 100%; }
textarea { min-height: 3.2em; resize: vertical; }
button { cursor: pointer; background: var(--panel); width: auto; }
button.primary { background: var(--accent); color: var(--panel); border-color: var(--accent); }
button:disabled { opacity: .5; cursor: default; }
.row { display: flex; gap: 8px; align-items: end; flex-wrap: wrap; }
.row > * { flex: 1 1 140px; }
.row > button { flex: 0 0 auto; }
details { margin-top: 12px; }
summary { cursor: pointer; color: var(--muted); font-size: 12px; }

/* attempts */
ul.tree, ul.tree ul { list-style: none; margin: 0; padding-left: 16px; }
ul.tree { padding-left: 0; }
.node { display: flex; gap: 6px; align-items: baseline; padding: 3px 6px;
        border-radius: 5px; cursor: pointer; font-family: var(--mono); font-size: 13px; }
.node:hover { background: var(--code); }
.node.selected { background: var(--sel); }
.node.retracted .label { text-decoration: line-through; color: var(--muted); }
.mark { width: 1.1em; text-align: center; flex: none; }
.mark.proved { color: var(--ok); } .mark.retracted { color: var(--bad); }
.mark.open { color: var(--muted); }

/* state */
.report { font-weight: 600; font-size: 15px; margin-bottom: 8px; }
.report.proved { color: var(--ok); }
table { border-collapse: collapse; width: 100%; font-size: 12.5px; }
th, td { text-align: left; padding: 5px 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { color: var(--muted); font-weight: 600; font-size: 11.5px; }
td.key { font-family: var(--mono); word-break: break-word; }
.status { font-weight: 600; }
.status.discharged { color: var(--ok); } .status.admitted { color: var(--warn); }
.status.refuted { color: var(--bad); } .status.open { color: var(--muted); }
.new { font-size: 11px; color: var(--accent); margin-left: 4px; }

/* move strip */
footer.moves { background: var(--panel); border-top: 1px solid var(--line); padding: 12px 16px; }
.args { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 4px 12px; }
.refusal { margin-top: 10px; padding: 8px 10px; border-radius: 6px;
           border: 1px solid var(--bad); color: var(--ink); }
.refusal .code { color: var(--bad); font-family: var(--mono); font-weight: 600; }
.refusal .residual { font-family: var(--mono); margin-top: 4px; }
.status-line { background: var(--bg); border-top: 1px solid var(--line);
               padding: 5px 16px; font-size: 12px; color: var(--muted); }
.status-line b { color: var(--ink); font-weight: 600; }

@media (max-width: 900px) {
  main { grid-template-columns: 1fr; }
  section { max-height: none; }
}
</style>
</head>
<body>
<main>
  <section id="problem-pane" aria-label="Problem">
    <h2>Problem</h2>
    <label for="problem-select">Corpus</label>
    <div class="row">
      <select id="problem-select"></select>
      <button id="start-problem" class="primary">Start</button>
    </div>
    <details>
      <summary>Your own goal</summary>
      <label for="own-goal">Goal</label>
      <input id="own-goal" class="term" placeholder="Int[x = 0 .. 1] x^2 == ?A">
      <label for="own-functions">Functions (name/arity, comma separated)</label>
      <input id="own-functions" class="term" placeholder="f/1">
      <div class="row" style="margin-top:8px"><button id="start-own">Start</button></div>
    </details>
    <div id="problem-info"></div>
    <h3>Parse echo</h3>
    <input id="echo-input" class="term" placeholder="type a term or a goal">
    <div id="echo-output" class="mono muted" style="margin-top:6px"></div>
  </section>

  <section id="attempts-pane" aria-label="Attempts">
    <h2>Attempts</h2>
    <div id="tree" class="muted">Start a problem.</div>
  </section>

  <section id="state-pane" aria-label="State">
    <h2>State</h2>
    <div id="state" class="muted">No node selected.</div>
  </section>
</main>

<footer class="moves" aria-label="Moves">
  <div class="row">
    <div style="flex:0 0 200px">
      <label for="move-select">Move</label>
      <select id="move-select"></select>
    </div>
    <div style="flex:1 1 auto"></div>
    <button id="check" class="primary" disabled title="Ctrl+Enter">Check</button>
    <button id="retract" disabled title="Alt+Up">Retract</button>
  </div>
  <div id="args" class="args"></div>
  <div id="refusal"></div>
</footer>
<div class="status-line" id="status-line">No session · <b>0 machine-checked</b></div>

<script>
"use strict";
const $ = (id) => document.getElementById(id);
const el = (tag, attrs = {}, ...kids) => {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "class") e.className = v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v);
  }
  for (const k of kids) e.append(k instanceof Node ? k : document.createTextNode(k ?? ""));
  return e;
};

const S = { session: null, node: null, nodes: {}, tree: [], moves: [], problems: [], title: null };

async function api(method, path, body) {
  const opts = { method, headers: {} };
  let url = path;
  if (method === "GET" && body) url += "?" + new URLSearchParams(body);
  else if (body) { opts.body = JSON.stringify(body); opts.headers["Content-Type"] = "application/json"; }
  const r = await fetch(url, opts);
  const data = await r.json();
  if (data.error) throw new Error(`${data.error.code}: ${data.error.message}`);
  return data;
}

function showRefusal(r) {
  const box = $("refusal");
  box.replaceChildren();
  if (!r) return;
  box.append(el("div", { class: "refusal", role: "alert" },
    el("div", {}, el("span", { class: "code" }, r.code), " ", r.message),
    r.residual ? el("div", { class: "residual" }, "residual: " + r.residual) : ""));
}

function showError(e) { showRefusal({ code: "error", message: String(e.message || e) }); }

// ---------------------------------------------------------------- problem
async function loadProblems() {
  const { problems } = await api("GET", "/problems");
  S.problems = problems;
  const sel = $("problem-select");
  sel.replaceChildren(...problems.map((p) => el("option", { value: p.id }, `${p.id} · ${p.title}`)));
}

async function start(body, title, statement) {
  showRefusal(null);
  try {
    const n = await api("POST", "/session", body);
    if (n.refusal) return showRefusal(n.refusal);
    S.session = n.session; S.nodes = {}; S.title = title;
    S.nodes[n.node] = n;
    $("problem-info").replaceChildren(
      el("h3", {}, title),
      statement ? el("p", {}, statement) : "",
      el("label", {}, "Formal goal"),
      el("div", { class: "goal mono" }, n.goal));
    await refreshTree();
    await select(n.node);
  } catch (e) { showError(e); }
}

$("start-problem").onclick = () => {
  const p = S.problems.find((q) => q.id === $("problem-select").value);
  if (p) start({ problem: p.id }, p.title, p.statement);
};
$("start-own").onclick = () => {
  const functions = {};
  for (const part of $("own-functions").value.split(",").map((s) => s.trim()).filter(Boolean)) {
    const [name, arity] = part.split("/");
    functions[name.trim()] = parseInt(arity, 10);
  }
  start({ goal: $("own-goal").value, functions }, "Your own goal", null);
};

let echoTimer = null;
$("echo-input").oninput = () => {
  clearTimeout(echoTimer);
  echoTimer = setTimeout(async () => {
    const text = $("echo-input").value.trim();
    const out = $("echo-output");
    if (!text) return out.replaceChildren();
    try {
      const r = await api("POST", "/parse", { text });
      out.textContent = r.refusal ? `${r.refusal.code}: ${r.refusal.message}` : r.term;
      out.className = "mono " + (r.refusal ? "" : "muted");
      out.style.color = r.refusal ? "var(--bad)" : "";
    } catch (e) { out.textContent = String(e.message); }
  }, 200);
};

// ---------------------------------------------------------------- attempts
async function refreshTree() {
  const { nodes } = await api("GET", "/tree", { session: S.session });
  S.tree = nodes;
  const kids = {};
  for (const n of nodes) (kids[n.parent] ??= []).push(n);
  const mark = (n) => n.retracted ? ["✗", "retracted"]
    : n.report.startsWith("Proved") ? ["✓", "proved"] : ["·", "open"];
  const build = (parent) => {
    const list = kids[parent];
    if (!list) return "";
    return el("ul", { class: parent === null ? "tree" : "" }, ...list.map((n) => {
      const [m, cls] = mark(n);
      const row = el("div", {
        class: "node" + (n.retracted ? " retracted" : "") + (n.node === S.node ? " selected" : ""),
        "data-node": n.node, tabindex: "0",
        onclick: () => select(n.node),
        onkeydown: (ev) => { if (ev.key === "Enter") select(n.node); },
      }, el("span", { class: "mark " + cls, title: n.report }, m),
         el("span", { class: "label" }, `${n.node} ${n.summary}`));
      return el("li", {}, row, build(n.node));
    }));
  };
  $("tree").className = "";
  $("tree").replaceChildren(build(null));
}

// ---------------------------------------------------------------- state
async function select(id) {
  const n = await api("GET", "/node", { session: S.session, node: id });
  S.node = id; S.nodes[id] = n;
  for (const row of document.querySelectorAll(".node"))
    row.classList.toggle("selected", row.dataset.node === id);
  renderState(n);
  renderArgs();
  $("check").disabled = false;
  $("retract").disabled = n.parent === null;
}

function renderState(n) {
  const parts = [el("div", { class: "report" + (n.report === "Proved." ? " proved" : ""), id: "report" }, n.report)];
  if (n.goal) parts.push(el("label", {}, "Goal"), el("div", { class: "goal mono", id: "goal" }, n.goal));
  if (n.theorem) parts.push(el("label", {}, "Theorem"), el("div", { class: "goal mono", id: "theorem" }, n.theorem));
  if (n.handles.length) parts.push(el("label", {}, "Facts bound here"), el("div", { class: "mono" }, n.handles.join(", ")));
  if (n.occurrences != null) parts.push(el("div", { class: "muted" }, `rewrite matched ${n.occurrences} occurrence(s)`));
  parts.push(el("label", {}, `Obligations (${n.obligations.length})`));
  if (n.obligations.length) {
    parts.push(el("table", {},
      el("thead", {}, el("tr", {}, ...["obligation", "status", "by", "from"].map((h) => el("th", {}, h)))),
      el("tbody", {}, ...n.obligations.map((o) => el("tr", {},
        el("td", { class: "key" }, o.key, o.new ? el("span", { class: "new" }, "new") : ""),
        el("td", {}, el("span", { class: "status " + o.status }, o.status),
          o.reason ? el("div", { class: "muted" }, o.reason) : ""),
        el("td", { class: "mono" }, [o.method, ...o.cites].filter(Boolean).join(", ")),
        el("td", { class: "muted" }, o.sources.join(", ")))))));
  } else parts.push(el("div", { class: "muted" }, "none"));
  $("state").className = "";
  $("state").replaceChildren(...parts);
  $("status-line").replaceChildren(
    `${S.title ?? ""} · node ${n.node} · `, el("b", { id: "status-report" }, n.report),
    " · check mode · ", el("b", {}, "0 machine-checked"));
}

// ---------------------------------------------------------------- moves
async function loadMoves() {
  const { moves } = await api("GET", "/moves");
  S.moves = moves;
  $("move-select").replaceChildren(...moves.map((m) => el("option", { value: m.name }, m.name)));
  $("move-select").onchange = renderArgs;
  renderArgs();
}

function renderArgs() {
  const move = S.moves.find((m) => m.name === $("move-select").value);
  const box = $("args");
  const keep = {};
  for (const inp of box.querySelectorAll("[data-arg]")) keep[inp.dataset.arg] = inp;
  box.replaceChildren();
  if (!move) return;
  const handles = S.node ? S.nodes[S.node]?.handles ?? [] : [];
  for (const a of move.args) {
    const id = "arg-" + a.name;
    const label = el("label", { for: id }, a.name + (a.optional ? " (optional)" : ""));
    let input;
    if (a.name === "check") {
      input = el("select", { id }, el("option", { value: "ring" }, "ring"), el("option", { value: "field" }, "field"));
    } else if (a.name === "mode") {
      input = el("select", { id }, el("option", { value: "" }, "(forward)"),
        el("option", { value: "forward" }, "forward"), el("option", { value: "reverse" }, "reverse"));
    } else if (a.name === "facts") {
      input = el("select", { id, multiple: "", size: String(Math.max(2, Math.min(4, handles.length))) },
        ...handles.map((h) => el("option", { value: h }, h)));
    } else if (a.type === "dict") {
      input = el("textarea", { id, placeholder: "u := sin t\n(one per line; empty for none)" });
    } else if (a.type === "int") {
      input = el("input", { id, type: "number", min: "0", placeholder: "0" });
    } else {
      input = el("input", { id, class: a.term ? "term" : "", placeholder: a.term ? "a term" : "" });
    }
    input.dataset.arg = a.name;
    input.dataset.optional = a.optional ? "1" : "";
    const old = keep[a.name];
    if (old && old.tagName === input.tagName && a.name !== "facts") input.value = old.value;
    box.append(el("div", {}, label, input));
  }
}

function collectArgs() {
  const args = {};
  for (const inp of $("args").querySelectorAll("[data-arg]")) {
    const name = inp.dataset.arg, optional = inp.dataset.optional === "1";
    if (name === "facts") {
      args.facts = [...inp.selectedOptions].map((o) => ["handle", o.value]);
    } else if (inp.tagName === "TEXTAREA") {
      const inst = {};
      for (const line of inp.value.split("\n").map((s) => s.trim()).filter(Boolean)) {
        const i = line.indexOf(":=");
        if (i < 0) throw new Error(`${name}: write each line as name := term`);
        inst[line.slice(0, i).trim()] = line.slice(i + 2).trim();
      }
      args[name] = inst;
    } else if (inp.type === "number") {
      if (inp.value !== "") args[name] = parseInt(inp.value, 10);
      else if (!optional) args[name] = 0;
    } else if (inp.value !== "" || !optional) {
      args[name] = inp.value;
    }
  }
  return args;
}

async function check() {
  if (!S.session || !S.node) return;
  showRefusal(null);
  let args;
  try { args = collectArgs(); } catch (e) { return showError(e); }
  try {
    const r = await api("POST", "/step", { session: S.session, node: S.node, move: $("move-select").value, args });
    if (r.refusal) return showRefusal(r.refusal);
    S.nodes[r.node] = r;
    await refreshTree();
    await select(r.node);
  } catch (e) { showError(e); }
}

async function retract() {
  if (!S.session || !S.node) return;
  showRefusal(null);
  try {
    const r = await api("POST", "/retract", { session: S.session, node: S.node });
    if (r.refusal) return showRefusal(r.refusal);
    await refreshTree();
    await select(r.node);
  } catch (e) { showError(e); }
}

$("check").onclick = check;
$("retract").onclick = retract;
document.addEventListener("keydown", (ev) => {
  if (ev.key === "Enter" && (ev.ctrlKey || ev.metaKey)) { ev.preventDefault(); check(); }
  else if (ev.altKey && ev.key === "ArrowUp") { ev.preventDefault(); retract(); }
  else if (ev.altKey && ev.key === "ArrowLeft" && S.node) {
    const p = S.nodes[S.node]?.parent; if (p) { ev.preventDefault(); select(p); }
  } else if (ev.altKey && ev.key === "ArrowRight" && S.node) {
    const kids = S.tree.filter((n) => n.parent === S.node);
    if (kids.length) { ev.preventDefault(); select(kids[kids.length - 1].node); }
  }
});

Promise.all([loadProblems(), loadMoves()]).catch(showError);
</script>
</body>
</html>
